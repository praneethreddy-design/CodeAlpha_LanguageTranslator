<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            resize: none;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .row div {
            flex: 1;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #007BFF;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        #clearBtn {
            background: crimson;
        }

        #clearBtn:hover {
            background: darkred;
        }

        #copyBtn {
            background: green;
        }

        #copyBtn:hover {
            background: darkgreen;
        }

        h3 {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="box">

<h1>🌍 AI Language Translator</h1>

<form method="POST">

<textarea
name="text"
id="inputText"
placeholder="Type your text here..."
required>{{ request.form.get('text','') }}</textarea>

<div class="row">

<div>
<label>From</label>

<select name="source_language">

<option value="auto">Auto Detect</option>
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>

</select>
</div>

<div>

<label>To</label>

<select name="language">

<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
<option value="ml">Malayalam</option>
<option value="mr">Marathi</option>
<option value="bn">Bengali</option>
<option value="gu">Gujarati</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="es">Spanish</option>

</select>

</div>

</div>

<div class="buttons">

<button type="submit">🌐 Translate</button>

<button type="button" id="clearBtn" onclick="clearAll()">🗑 Clear</button>

</div>

</form>

{% if translated %}

<h3>Translated Text</h3>

<textarea id="translatedText" readonly>{{ translated }}</textarea>

<div class="buttons">

<button type="button" id="copyBtn" onclick="copyText()">📋 Copy</button>

</div>

{% endif %}

</div>

<script>

function copyText(){

let text=document.getElementById("translatedText");

navigator.clipboard.writeText(text.value);

alert("Copied Successfully!");

}

function clearAll(){

document.getElementById("inputText").value="";

}

</script>

</body>

</html>
